<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Seniors vs Troublemakers</title>
    <style>
      :root {
        --ink: #2f2a26;
        --paper: #fdf6e3;
        --card: #fffdf6;
        --line: #d9cfb8;
        --accent: #e07a5f;
        --good: #4d9d74;
        --shadow: 0 2px 0 #d9cfb8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.45 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-text-size-adjust: 100%;
      }
      #app { max-width: 1320px; margin: 0 auto; padding: 12px; }
      #hud {
        display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
        padding: 8px 14px; margin-bottom: 10px;
        background: var(--card); border: 2px solid var(--line); border-radius: 12px;
      }
      #hud h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
      #hud h1 small { font-weight: normal; opacity: .6; font-size: 12px; display: block; }
      /*
       * The board sets the height of the row and the aside stretches to it,
       * which is what makes the tower panel end exactly on the board's bottom
       * border. The hint moved out from under the board for the same reason:
       * anything below the canvas inside #stage would have made the column
       * taller than the board it is being measured against.
       */
      #main { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
      #stage { flex: 1 1 640px; min-width: 320px; }
      #boardWrap { position: relative; }
      canvas {
        width: 100%; height: auto; display: block;
        border: 2px solid var(--line); border-radius: 12px;
        background: #8fbf7a; touch-action: manipulation;
      }
      #hint { margin: 8px 2px 0; min-height: 20px; opacity: .75; font-size: 13px; }
      #build { flex: 0 0 310px; display: flex; flex-direction: column; gap: 10px; }
      /* The list is the part that gives, so the panel's bottom stays put. */
      #towerPanel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
      #towerList { overflow-y: auto; min-height: 0; }
      @media (max-width: 760px) {
        #build { flex: 1 1 100%; }
        #towerList { overflow-y: visible; }
      }
      section, #controls {
        background: var(--card); border: 2px solid var(--line);
        border-radius: 12px; padding: 10px 12px;
      }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
           margin: 0 0 8px; opacity: .6; }
      .card {
        display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center;
        width: 100%; text-align: left; padding: 6px 8px; margin-bottom: 4px;
        background: #fff; border: 2px solid var(--line); border-radius: 10px;
        cursor: pointer; font: inherit; color: inherit;
      }
      .card:last-child { margin-bottom: 0; }
      .card .g { font-size: 18px; line-height: 1; }
      .card .n { font-weight: bold; font-size: 13px; }
      .card .b { display: none; font-size: 11px; opacity: .7; line-height: 1.3; margin-top: 2px; }
      .card .c { font-weight: bold; font-size: 13px; white-space: nowrap; }
      .card.on { border-color: var(--accent); background: #fff3ee; }
      .card.on .b { display: block; }
      /*
       * The fold-out. Only the selected card opens one, so the panel shows
       * the whole of one neighbour instead of a line each about six.
       */
      .card .fold { display: none; grid-column: 1 / -1; gap: 10px;
                    margin-top: 6px; padding-top: 8px;
                    border-top: 2px dotted var(--line); }
      .card.on .fold { display: flex; }
      .card .fold img { width: 116px; height: 116px; flex: 0 0 116px;
                        align-self: center; }
      .card .fold .big { font-size: 74px; line-height: 116px; width: 116px;
                         flex: 0 0 116px; text-align: center; }
      .card .fold .rows { flex: 1 1 auto; min-width: 0; }
      .card.poor { opacity: .45; cursor: not-allowed; }
      .card.locked { opacity: .4; cursor: not-allowed; }
      .card.bought { border-color: var(--good); background: #f1f8f3; cursor: default; }
      #upgrades { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
      #upgrades .upath h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase;
                             letter-spacing: .06em; opacity: .6; }
      #upgrades .card { grid-template-columns: 1fr auto; padding: 6px 8px; margin-bottom: 4px; }
      #upgrades .card .n { font-size: 12px; }
      #upgrades .card .b { display: block; font-size: 10.5px; margin-top: 0; }
      /*
       * On the board rather than under it, in the bottom-right corner --
       * nearest the build menu the other hand is already working in, and
       * clear of the road.
       */
      #controls {
        position: absolute; right: 12px; bottom: 12px;
        display: flex; gap: 8px; align-items: center;
      }
      /*
       * Solid rather than translucent, unlike the readouts it sits between.
       * Those are painted into the canvas, where the lawn behind them is
       * already drawn; a see-through DOM element over the canvas is at the
       * mercy of how the browser composites the two, and rendered light in
       * testing. A control has to be legible everywhere, so it is opaque.
       */
      #controls button {
        background: #332c26; color: #fff;
        border: 2px solid rgba(255, 255, 255, .28);
      }
      #controls button:hover:not(:disabled) { border-color: #fff; }
      #run { font-weight: bold; }
      #speed { padding: 8px 10px; }
      button {
        font: inherit; padding: 8px 12px; border-radius: 9px; cursor: pointer;
        border: 2px solid var(--line); background: #fff; color: inherit;
      }
      button:hover:not(:disabled):not([aria-disabled="true"]) { border-color: var(--accent); }
      button:disabled, button[aria-disabled="true"] { opacity: .45; cursor: default; }
      #preview { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
      #preview span { display: flex; align-items: center; gap: 4px; }
      .statrow { display: flex; justify-content: space-between; gap: 10px;
                 font-size: 12px; padding: 2px 0; border-bottom: 1px dotted var(--line); }
      .statrow:last-child { border-bottom: none; }
      .statrow i { font-style: normal; opacity: .6; }
      /* What a hovered upgrade would change, old value struck through. */
      .statrow.changed span { color: var(--good); font-weight: 600; }
      .statrow.changed s { color: var(--ink); opacity: .45; font-weight: 400; }
      #inspectHead { display: flex; justify-content: space-between; align-items: center; }
      #inspectHead h3 { margin: 0 0 6px; font-size: 15px; }
      #inspectClose { padding: 2px 8px; }
      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: rgba(30, 26, 22, .55); padding: 20px;
      }
      #overlay > div {
        background: var(--card); border: 2px solid var(--line); border-radius: 14px;
        padding: 22px 26px; max-width: 380px; text-align: center;
      }
      #overlay h2 { font-size: 20px; text-transform: none; letter-spacing: 0; opacity: 1; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <h1>Seniors vs Troublemakers<small>Keep the street quiet</small></h1>
      </header>

      <div id="main">
        <div id="stage">
          <div id="boardWrap">
            <canvas id="board" width="960" height="600"></canvas>
            <div id="controls">
              <button id="run" title="Start the round, or pause it (Space)">Start round</button>
              <button id="speed" title="Cycle 1x / 2x / 3x (F)">1&times;</button>
            </div>
          </div>
        </div>

        <aside id="build">
          <section>
            <h2>Next round brings</h2>
            <div id="preview"></div>
          </section>

          <section id="towerPanel">
            <h2>The neighbours</h2>
            <div id="towerList"></div>
          </section>

          <section id="inspect" hidden>
            <div id="inspectHead">
              <h3 id="inspectTitle"></h3>
              <button id="inspectClose" title="Close">✕</button>
            </div>
            <div id="inspectBody"></div>
            <div id="upgrades"></div>
            <button id="sell">Send home</button>
          </section>

        </aside>
      </div>
      <p id="hint"></p>
    </div>

    <div id="overlay" hidden>
      <div>
        <h2 id="overlayTitle"></h2>
        <p id="overlayBody"></p>
        <button id="restart">Try the street again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
