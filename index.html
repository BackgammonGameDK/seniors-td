<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Seniors vs Troublemakers</title>
    <style>
      :root {
        --ink: #2f2a26;
        --paper: #fdf6e3;
        --card: #fffdf6;
        --line: #d9cfb8;
        --accent: #e07a5f;
        --good: #4d9d74;
        --shadow: 0 2px 0 #d9cfb8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.45 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        -webkit-text-size-adjust: 100%;
      }
      #app { max-width: 1320px; margin: 0 auto; padding: 12px; }
      #hud {
        display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
        padding: 8px 14px; margin-bottom: 10px;
        background: var(--card); border: 2px solid var(--line); border-radius: 12px;
      }
      #hud h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
      #hud h1 small { font-weight: normal; opacity: .6; font-size: 12px; display: block; }
      .readout { display: flex; align-items: baseline; gap: 5px; }
      .readout b { font-size: 20px; }
      .readout small { opacity: .65; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; }
      #main { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
      #stage { flex: 1 1 640px; min-width: 320px; }
      canvas {
        width: 100%; height: auto; display: block;
        border: 2px solid var(--line); border-radius: 12px;
        background: #8fbf7a; touch-action: manipulation;
      }
      #hint { margin: 8px 2px 0; min-height: 20px; opacity: .75; font-size: 13px; }
      #build { flex: 0 0 310px; display: flex; flex-direction: column; gap: 10px; }
      @media (max-width: 760px) { #build { flex: 1 1 100%; } }
      section, #controls {
        background: var(--card); border: 2px solid var(--line);
        border-radius: 12px; padding: 10px 12px;
      }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
           margin: 0 0 8px; opacity: .6; }
      .card {
        display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center;
        width: 100%; text-align: left; padding: 7px 8px; margin-bottom: 6px;
        background: #fff; border: 2px solid var(--line); border-radius: 10px;
        cursor: pointer; font: inherit; color: inherit;
      }
      .card:last-child { margin-bottom: 0; }
      .card .g { font-size: 22px; line-height: 1; }
      .card .n { font-weight: bold; font-size: 14px; }
      .card .b { font-size: 11px; opacity: .7; line-height: 1.3; }
      .card .c { font-weight: bold; font-size: 13px; white-space: nowrap; }
      .card.on { border-color: var(--accent); background: #fff3ee; }
      .card.poor { opacity: .45; cursor: not-allowed; }
      #controls { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit; padding: 8px 12px; border-radius: 9px; cursor: pointer;
        border: 2px solid var(--line); background: #fff; color: inherit;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .45; cursor: default; }
      #startWave { background: var(--good); color: #fff; border-color: #3f8460; font-weight: bold; }
      #startWave:disabled { background: #cfcfcf; border-color: var(--line); color: #777; }
      #preview { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
      #preview span { display: flex; align-items: center; gap: 4px; }
      .statrow { display: flex; justify-content: space-between; gap: 10px;
                 font-size: 12px; padding: 2px 0; border-bottom: 1px dotted var(--line); }
      .statrow:last-child { border-bottom: none; }
      .statrow i { font-style: normal; opacity: .6; }
      #inspectHead { display: flex; justify-content: space-between; align-items: center; }
      #inspectHead h3 { margin: 0 0 6px; font-size: 15px; }
      #inspectClose { padding: 2px 8px; }
      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: rgba(30, 26, 22, .55); padding: 20px;
      }
      #overlay > div {
        background: var(--card); border: 2px solid var(--line); border-radius: 14px;
        padding: 22px 26px; max-width: 380px; text-align: center;
      }
      #overlay h2 { font-size: 20px; text-transform: none; letter-spacing: 0; opacity: 1; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <h1>Seniors vs Troublemakers<small>Keep the street quiet</small></h1>
        <span class="readout"><b id="gold">0</b><small>pension coins</small></span>
        <span class="readout"><b id="lives">0</b><small>peace &amp; quiet</small></span>
        <span class="readout"><b id="wave">1/20</b><small>round</small></span>
      </header>

      <div id="main">
        <div id="stage">
          <canvas id="board" width="960" height="600"></canvas>
          <p id="hint"></p>
        </div>

        <aside id="build">
          <section>
            <h2>Next round brings</h2>
            <div id="preview"></div>
          </section>

          <section id="towerPanel">
            <h2>The neighbours</h2>
            <div id="towerList"></div>
          </section>

          <section id="inspect" hidden>
            <div id="inspectHead">
              <h3 id="inspectTitle"></h3>
              <button id="inspectClose" title="Close">✕</button>
            </div>
            <div id="inspectBody"></div>
            <button id="sell">Send home</button>
          </section>

          <div id="controls">
            <button id="startWave">Start round</button>
            <button id="pause" title="Pause or resume (P)">Pause</button>
            <button id="speed" title="Cycle 1x / 2x / 3x (F)">1&times;</button>
          </div>
        </aside>
      </div>
    </div>

    <div id="overlay" hidden>
      <div>
        <h2 id="overlayTitle"></h2>
        <p id="overlayBody"></p>
        <button id="restart">Try the street again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
