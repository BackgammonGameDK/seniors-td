name: Checks

# The same typecheck and tests the deploy gates on, run early enough to matter:
# on a pull request, before the merge, rather than after it. Main is left to
# deploy.yml, which runs these before it publishes.
#
# Pull requests only, deliberately. A branch push trigger as well would fire a
# second run for the same commit, and the one the concurrency group cancelled
# still showed on the pull request as a cancelled check -- which is noise now
# and a problem later, once a branch protection rule requires this job to pass.
# A branch with no pull request open is covered by the edit hook, which
# typechecks and tests locally on every change.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The full suite, not test:fast. The balance sweeps take about twenty
      # seconds, which is too slow for the edit hook and irrelevant here.
      - run: npm test
